<form>
    <mat-dialog-content>
        <div class="inf_block">
            <h5 class="text-center">Авторизация</h5>
            <h1 class="text-center">Для сотрудников</h1>
        </div>
        <hr>
        <mat-form-field>
            <mat-label>Логин</mat-label>
            <input matInput [formControl]="loginvalid"
            (blur)="updateErrorMessage()"
            [maxLength]="30" 
            required [(ngModel)]="person.login" 
            name="login">
            <mat-icon matSuffix>person</mat-icon>
            <mat-error>
                {{errorMessageLogin}}
            </mat-error>
        </mat-form-field>
        <mat-form-field>
            <mat-label>Пароль</mat-label>
            <input matInput type="password" [(ngModel)]="person.password" name="password">
        </mat-form-field>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button class="button-bron" mat-button cdkFocusInitial (click)="login()">
            Войти
        </button>
    </mat-dialog-actions>
</form>
